# Run when commits are pushed to chore/release-communications
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - chore/release-communications

# Set up permissions for deploying with secretless Azure federated credentials
# https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure?tabs=azure-portal%2Clinux#set-up-azure-login-with-openid-connect-authentication
permissions:
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SERVICENOW_REQUESTED_FOR_DIAGNOSTICS_INCLUDE_PII: ${{ vars.SERVICENOW_REQUESTED_FOR_DIAGNOSTICS_INCLUDE_PII }}
      LOG_INCLUDE_CALLER_IDENTITY: ${{ vars.LOG_INCLUDE_CALLER_IDENTITY }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      SERVICENOW_OAUTH_GRANT_TYPE: ${{ vars.SERVICENOW_OAUTH_GRANT_TYPE }}
      SERVICENOW_OAUTH_CLIENT_AUTH_STYLE: ${{ vars.SERVICENOW_OAUTH_CLIENT_AUTH_STYLE }}
      ENTRA_ALLOW_ANY_TENANT: ${{ vars.ENTRA_ALLOW_ANY_TENANT }}
      ENTRA_OBO_DOWNSTREAM_SCOPE: ${{ vars.ENTRA_OBO_DOWNSTREAM_SCOPE }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      ENTRA_AUTH_DISABLED: ${{ vars.ENTRA_AUTH_DISABLED }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      SERVICENOW_REQUESTED_FOR_LOOKUP_FIELDS: ${{ vars.SERVICENOW_REQUESTED_FOR_LOOKUP_FIELDS }}
      SERVICENOW_REQUESTED_FOR_DIAGNOSTICS: ${{ vars.SERVICENOW_REQUESTED_FOR_DIAGNOSTICS }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      ENTRA_DCR_ALLOW_UNAUTHENTICATED: ${{ vars.ENTRA_DCR_ALLOW_UNAUTHENTICATED }}
      ENTRA_ALLOWED_AUDIENCES: ${{ vars.ENTRA_ALLOWED_AUDIENCES }}
      ENTRA_OBO_ENABLED: ${{ vars.ENTRA_OBO_ENABLED }}
      SERVICENOW_REQUESTED_FOR_FALLBACK_TO_CALLER_VALUE: ${{ vars.SERVICENOW_REQUESTED_FOR_FALLBACK_TO_CALLER_VALUE }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      LOG_INCLUDE_ERROR_STACK: ${{ vars.LOG_INCLUDE_ERROR_STACK }}
      SERVICENOW_REQUIRE_CALLER_ACCESS_TOKEN: ${{ vars.SERVICENOW_REQUIRE_CALLER_ACCESS_TOKEN }}
      SERVICENOW_OAUTH_TOKEN_PATH: ${{ vars.SERVICENOW_OAUTH_TOKEN_PATH }}
      SERVICENOW_REQUESTED_FOR_CALLER_FIELDS: ${{ vars.SERVICENOW_REQUESTED_FOR_CALLER_FIELDS }}
      SERVICENOW_INSTANCE_URL: ${{ vars.SERVICENOW_INSTANCE_URL }}
      SERVICENOW_CLIENT_ID: ${{ vars.SERVICENOW_CLIENT_ID }}
      SERVICENOW_USERNAME: ${{ vars.SERVICENOW_USERNAME }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_OAUTH_SCOPES: ${{ vars.ENTRA_OAUTH_SCOPES }}
      SERVICENOW_KNOWLEDGE_TABLE_FALLBACK_ENABLED: ${{ vars.SERVICENOW_KNOWLEDGE_TABLE_FALLBACK_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh


      - name: Provision Infrastructure
        run: azd provision --no-prompt
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          SERVICENOW_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}

      - name: Deploy Application
        run: azd deploy --no-prompt
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          SERVICENOW_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
        
