name: deploy

# Continuous deployment to Azure via the Azure Developer CLI (azd).
#
# SAFE BY DEFAULT: this workflow is INERT until you configure the AZURE_*
# repository/environment *variables* (see the `if:` guard below). Until then it
# is skipped — it will never produce a failing run. App secrets are NOT handled
# here: they live in Azure Key Vault (set once during `azd up` / provisioning)
# and the Function App reads them via managed identity.
#
# One-time setup (creates the OIDC federated credential + the variables below):
#   azd pipeline config --provider github
#
# Auth uses OpenID Connect (workload identity federation) — no long-lived
# service-principal secret is ever stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact 40-character commit SHA to deploy to the test environment
        required: true
        type: string

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy application code (azd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inert until AZURE_ENV_NAME is set as a repo/environment variable.
    if: ${{ vars.AZURE_ENV_NAME != '' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      ENTRA_ALLOWED_AUDIENCES: ${{ vars.ENTRA_ALLOWED_AUDIENCES }}
      ENTRA_AUDIENCE: ${{ vars.ENTRA_AUDIENCE }}
      ENTRA_AUTH_DISABLED: ${{ vars.ENTRA_AUTH_DISABLED }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_OAUTH_SCOPES: ${{ vars.ENTRA_OAUTH_SCOPES }}
      ENTRA_OBO_DOWNSTREAM_SCOPE: ${{ vars.ENTRA_OBO_DOWNSTREAM_SCOPE }}
      ENTRA_OBO_ENABLED: ${{ vars.ENTRA_OBO_ENABLED }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      SERVICENOW_CLIENT_ID: ${{ vars.SERVICENOW_CLIENT_ID }}
      SERVICENOW_INSTANCE_URL: ${{ vars.SERVICENOW_INSTANCE_URL }}
      SERVICENOW_KNOWLEDGE_TABLE_FALLBACK_ENABLED: ${{ vars.SERVICENOW_KNOWLEDGE_TABLE_FALLBACK_ENABLED }}
      SERVICENOW_OAUTH_GRANT_TYPE: ${{ vars.SERVICENOW_OAUTH_GRANT_TYPE }}
      SERVICENOW_OAUTH_TOKEN_PATH: ${{ vars.SERVICENOW_OAUTH_TOKEN_PATH }}
      SERVICENOW_USERNAME: ${{ vars.SERVICENOW_USERNAME }}
    steps:
      - name: Validate exact candidate
        shell: bash
        run: |
          if [[ ! "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_ref must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login (OIDC federated credential)
        run: >-
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --federated-credential-provider github
          --tenant-id "$AZURE_TENANT_ID"

      - name: Reconcile test infrastructure
        run: azd provision --no-prompt
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SERVICENOW_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}

      - name: Deploy application code to Azure
        run: azd deploy --no-prompt
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          SERVICENOW_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}

      - name: Validate live MCP tools
        shell: bash
        run: |
          endpoint="$(azd env get-value MCP_ENDPOINT_URL)"
          npm run validate:live -- --endpoint "$endpoint"
