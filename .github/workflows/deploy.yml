name: deploy

# Continuous deployment to Azure via the Azure Developer CLI (azd).
#
# SAFE BY DEFAULT: this workflow is INERT until you configure the AZURE_*
# repository/environment *variables* (see the `if:` guard below). Until then it
# is skipped — it will never produce a failing run. App secrets are NOT handled
# here: they live in Azure Key Vault (set once during `azd up` / provisioning)
# and the Function App reads them via managed identity.
#
# One-time setup (creates the OIDC federated credential + the variables below):
#   azd pipeline config --provider github
#
# Auth uses OpenID Connect (workload identity federation) — no long-lived
# service-principal secret is ever stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact 40-character commit SHA to deploy to the test environment
        required: true
        type: string

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy application code (azd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inert until AZURE_ENV_NAME is set as a repo/environment variable.
    if: ${{ vars.AZURE_ENV_NAME != '' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
      CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
    steps:
      - name: Validate exact candidate
        shell: bash
        run: |
          if [[ ! "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_ref must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create remote-build source package
        shell: bash
        run: |
          mkdir -p .tmp
          zip -q -r .tmp/candidate-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' '.tmp/*' '.azure/*' \
               'local.settings.json' '.env' 'env/*' 'debug/*' \
               'm365-agent/appPackage/build/*'

      - name: Deploy application code to Azure
        run: >-
          az functionapp deployment source config-zip
          --name "$FUNCTION_APP_NAME"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --src .tmp/candidate-source.zip
          --build-remote true
          --timeout 600
          --output none

      - name: Validate live MCP tools
        shell: bash
        run: |
          endpoint="https://${FUNCTION_APP_NAME}.azurewebsites.net/mcp"
          npm run validate:live -- --endpoint "$endpoint"
