<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ServiceNow Order Detail</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b;
    --border: #e0e0e0; --accent: #0078d4; --accent-fg: #ffffff;
    --chip-bg: #eef4fb; --chip-fg: #1c3c5e;
    --surface: #f7f7f7; --success: #107c10; --success-bg: #f1faf1; --success-fg: #ffffff;
    --warning: #8a5700; --warning-bg: #fff8e8; --warning-fg: #ffffff;
    --danger: #c50f1f; --danger-bg: #fff1f2; --danger-fg: #ffffff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #1f1f1f; --fg: #f3f2f1; --muted: #b3b3b3;
    --border: #3b3a39; --accent: #0f6cbd;
    --chip-bg: #1c3c5e; --chip-fg: #cfe5fb;
    --surface: #292929; --success: #0f6c0f; --success-bg: #193019; --success-fg: #ffffff;
    --warning: #f3c363; --warning-bg: #382b12; --warning-fg: #201a0f;
    --danger: #ff99a4; --danger-bg: #3b191d; --danger-fg: #2b1115;
  }
  html { overflow-x: hidden; }
  body { margin: 0; padding: 24px; box-sizing: border-box; width: 100%; overflow-x: hidden; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0; line-height: 1.35; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  .order-head { margin-bottom: 14px; }
  .eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .status-panel {
    display: grid; grid-template-columns: 36px 1fr; gap: 12px;
    border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 14px; background: var(--surface);
  }
  .status-panel.success { border-left-color: var(--success); background: var(--success-bg); }
  .status-panel.warning { border-left-color: var(--warning); background: var(--warning-bg); }
  .status-panel.danger { border-left-color: var(--danger); background: var(--danger-bg); }
  .status-panel > div:last-child { min-width: 0; }
  .status-icon {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  }
  .success .status-icon { background: var(--success); }
  .success .status-icon { color: var(--success-fg); }
  .warning .status-icon { background: var(--warning); color: var(--warning-fg); }
  .danger .status-icon { background: var(--danger); color: var(--danger-fg); }
  .status-title-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status-title { font-size: 16px; font-weight: 650; }
  .status-copy { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.45; overflow-wrap: anywhere; }
  .next-step { font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; }
  .next-step strong { font-weight: 650; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    background: var(--chip-bg); color: var(--chip-fg); font-size: 12px;
  }
  .status-panel.success .chip { background: var(--success); color: var(--success-fg); }
  .status-panel.warning .chip { background: var(--warning); color: var(--warning-fg); }
  .status-panel.danger .chip { background: var(--danger); color: var(--danger-fg); }
  .progress {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0; margin: 14px 0 4px;
  }
  .progress-step { position: relative; text-align: center; color: var(--muted); font-size: 11px; }
  .progress-step::before {
    content: ""; position: absolute; height: 2px; background: var(--border);
    top: 9px; left: 0; right: 0;
  }
  .progress-step:first-child::before { left: 50%; }
  .progress-step:last-child::before { right: 50%; }
  .progress-dot {
    position: relative; z-index: 1; display: grid; place-items: center;
    width: 20px; height: 20px; margin: 0 auto 5px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg); box-sizing: border-box;
  }
  .progress-step.done { color: var(--fg); }
  .progress-step.done::before { background: var(--success); }
  .progress-step.done .progress-dot { background: var(--success); border-color: var(--success); color: #fff; }
  .progress-step.current { color: var(--fg); font-weight: 600; }
  .progress-step.current .progress-dot { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--bg); background: var(--accent); }
  .facts {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px; margin-top: 16px;
  }
  .fact { min-width: 0; }
  .fact-label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .fact-value { font-size: 13px; word-break: break-word; }
  .items, .approvals { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .item, .approval { padding: 10px 12px; }
  .item + .item, .approval + .approval { border-top: 1px solid var(--border); }
  .item-row, .approval-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .item-row > :first-child, .approval-row > :first-child { min-width: 0; }
  .item .name { font-weight: 600; font-size: 13px; }
  .item .desc, .approval-meta, .more { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item-badges { display: flex; align-items: center; gap: 6px; flex: 0 1 45%; min-width: 0; }
  .item-badges .chip { max-width: 100%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .state-dot.approved { background: var(--success); }
  .state-dot.rejected { background: var(--danger); }
  .decision {
    margin-top: 12px; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; background: var(--surface);
  }
  .decision-title { font-size: 13px; font-weight: 650; }
  .decision-copy { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .decision input {
    width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 7px 8px;
    font: inherit; margin-top: 10px;
  }
  .notice { border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .notice.success { background: var(--success-bg); color: var(--fg); border: 1px solid var(--success); }
  .notice.error { background: var(--danger-bg); color: var(--fg); border: 1px solid var(--danger); }
  .busy-status { margin-top: 12px; color: var(--muted); font-size: 13px; }
  .confirm { margin-top: 14px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .confirm strong { font-size: 13px; }
  .confirm p { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    padding: 6px 12px; border-radius: 4px; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.6; cursor: progress; }
  .btn-link {
    display: inline-block; text-decoration: none; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 4px; font: inherit; cursor: pointer;
  }
  .btn-link.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .empty { color: var(--muted); }
  @media (max-width: 540px) {
    body { padding: 18px; }
    .facts { grid-template-columns: 1fr 1fr; }
    .progress-step { font-size: 10px; }
    .item-row, .approval-row { align-items: flex-start; }
  }
</style>
<!-- MCP_HOST_BRIDGE -->
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  // --- MCP Apps host bridge (window.mcpHost from host-bridge.ts) -----------
  function host() { return (typeof window !== "undefined" && window.mcpHost) || null; }
  function getData() { var h = host(); return h ? h.getData() : null; }
  function applyTheme() { var h = host(); if (h && h.applyTheme) h.applyTheme(); }
  function callTool(name, args) {
    var h = host();
    if (h && typeof h.callTool === "function") return h.callTool(name, args || {});
    return Promise.reject(new Error("MCP Apps host bridge unavailable."));
  }
  // Tool results may arrive as the raw MCP result ({ structuredContent: {...} })
  // or already-unwrapped data. Normalize to the structuredContent payload the
  // render() function consumes.
  function unwrapResult(result) {
    if (result && typeof result === "object") {
      if (result.structuredContent && typeof result.structuredContent === "object") {
        return result.structuredContent;
      }
      if (Array.isArray(result.content)) {
        for (var i = 0; i < result.content.length; i++) {
          if (result.content[i] && typeof result.content[i].text === "string") {
            try { return JSON.parse(result.content[i].text); } catch (_) {}
          }
        }
      }
    }
    return result || {};
  }
  function sendFollowUp(text) {
    var h = host();
    if (h && typeof h.sendFollowUp === "function") { try { h.sendFollowUp(text); } catch (_) {} }
  }
  // Open an external URL through the host bridge (sandbox blocks window.open /
  // <a target=_blank> inside the widget iframe). Falls back to window.open only
  // for local/standalone testing where no host bridge is present.
  function openExternal(url) {
    var h = host();
    if (h && typeof h.openExternal === "function") {
      try { if (h.openExternal(url)) return; } catch (_) {}
    }
    try { window.open(url, "_blank", "noopener"); } catch (_) {}
  }
  function subscribe(cb) {
    var h = host();
    if (h && typeof h.onData === "function") { h.onData(cb); return true; }
    return false;
  }
  function showLoading(el, msg) {
    el.innerHTML = "";
    var p = document.createElement("p"); p.className = "empty";
    p.textContent = msg || "Loading\u2026"; el.appendChild(p);
  }
  function readStr(v) {
    if (v == null) return "";
    if (typeof v === "string") return v;
    if (typeof v === "object") return v.display_value || v.value || "";
    return String(v);
  }
  function isPendingApprovalState(state) {
    return classifyApprovalState(state) === "pending";
  }

  // Presentation-only lifecycle model. ServiceNow often leaves sc_request.state
  // as "Open" after approval, so approval rows and requested-item stages are the
  // authoritative signals for the human-facing next step.
  function normalizeSignal(value) {
    return readStr(value).toLowerCase().replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function matchesAny(value, terms) {
    var signal = normalizeSignal(value);
    for (var i = 0; i < terms.length; i++) {
      if (signal === terms[i]) return true;
    }
    return false;
  }
  function classifyApprovalState(value) {
    if (matchesAny(value, ["rejected", "denied", "not approved"])) return "rejected";
    if (matchesAny(value, ["approved", "not required"])) return "approved";
    if (matchesAny(value, ["requested", "pending", "awaiting approval", "approval requested"])) return "pending";
    return "unknown";
  }
  function derivePhase(order, items, approvals, submitted) {
    var requestSignals = [order.state, order.request_status, order.stage];
    var approvalStates = approvals.map(function (approval) { return classifyApprovalState(approval.state); });
    var fallbackApproval = classifyApprovalState(order.approval);
    var hasRejectedApproval = approvalStates.indexOf("rejected") >= 0 || fallbackApproval === "rejected";
    var hasPendingApproval = approvalStates.indexOf("pending") >= 0 || (approvals.length === 0 && fallbackApproval === "pending");
    var classifiedApprovals = approvalStates.filter(function (state) { return state !== "unknown"; });
    var approvalsComplete = approvals.length > 0 && classifiedApprovals.length === approvals.length &&
      classifiedApprovals.every(function (state) { return state === "approved"; });
    if (approvals.length === 0 && fallbackApproval === "approved") approvalsComplete = true;

    var canceled = requestSignals.some(function (signal) {
      return matchesAny(signal, ["cancelled", "canceled", "closed cancelled", "closed canceled"]);
    });
    var rejected = hasRejectedApproval || requestSignals.some(function (signal) {
      return matchesAny(signal, ["rejected", "denied", "not approved"]);
    });
    if (canceled) return { key: "canceled", badge: "Canceled", title: "Request canceled", tone: "danger", icon: "\u00d7", copy: "No further fulfillment is expected.", next: "No action is required." };
    if (rejected) return { key: "rejected", badge: "Not approved", title: "Request rejected", tone: "danger", icon: "\u00d7", copy: "This request will not move to fulfillment.", next: "Review the decision in ServiceNow if more context is needed." };

    var unsuccessfulTerms = ["incomplete", "closed incomplete", "closed skipped"];
    var requestUnsuccessful = requestSignals.some(function (signal) { return matchesAny(signal, unsuccessfulTerms); });
    if (requestUnsuccessful) {
      return { key: "closed", badge: "Closed", title: "Request closed without completion", tone: "danger", icon: "!", copy: "ServiceNow closed this request before fulfillment completed.", next: "Open the request in ServiceNow for closure details or contact the service desk." };
    }

    var completeTerms = ["closed complete", "completed", "complete", "fulfilled", "delivered"];
    var itemStages = items.map(function (item) { return item.stage || item.state; }).filter(function (value) { return !!readStr(value); });
    var requestComplete = requestSignals.some(function (signal) { return matchesAny(signal, completeTerms); });
    var allItemsComplete = itemStages.length > 0 && itemStages.every(function (signal) { return matchesAny(signal, completeTerms); });
    if (requestComplete || (!hasPendingApproval && allItemsComplete)) {
      return { key: "complete", badge: "Complete", title: "Request complete", tone: "success", icon: "\u2713", copy: "All fulfillment work is complete.", next: "No action is required." };
    }
    if (hasPendingApproval) {
      return { key: "pending", badge: "Pending approval", title: "Waiting for approval", tone: "warning", icon: "!", copy: "Approval is required before fulfillment can begin.", next: "The assigned approver must approve or reject this request." };
    }

    var underwayTerms = ["fulfillment", "fulfilment", "delivery", "shipping", "work in progress", "in progress", "implementation", "processing"];
    var underway = requestSignals.concat(itemStages).some(function (signal) { return matchesAny(signal, underwayTerms); });
    if (underway) {
      return { key: "underway", badge: approvalsComplete ? "Approved" : "In progress", title: "Delivery or work is underway", tone: "success", icon: "\u2192", copy: "The fulfillment team is delivering the item or completing the work.", next: "Wait for fulfillment to complete; ServiceNow will update this request." };
    }
    if (approvalsComplete) {
      return { key: "approved", badge: "Approved", title: "Approved", tone: "success", icon: "\u2713", copy: "Approval is complete. This request is queued for fulfillment.", next: "The fulfillment team will begin delivery or complete the requested work." };
    }
    if (submitted) {
      return { key: "submitted", badge: "Submitted", title: "Request received", tone: "", icon: "\u2713", copy: "ServiceNow received this request.", next: "Status details will appear as the request moves through its workflow." };
    }
    return { key: "unknown", badge: readStr(order.stage) || readStr(order.state) || "In progress", title: "Request in progress", tone: "", icon: "\u2022", copy: "ServiceNow is processing this request.", next: "Check back for approval or fulfillment updates." };
  }

  var root = document.getElementById("root");
  applyTheme();

  // Latest rendered detail payload, a one-shot success banner, and the current
  // order sys_id — used by the in-widget action handlers to re-render in place.
  var lastData = null;
  var pendingBanner = null;
  var pendingError = null;
  var interactionMode = null;
  var currentOrderSysId = "";

  function render(payload) {
    root.innerHTML = "";
    var data = payload || getData();
    if (!data || typeof data !== "object") {
      var e = document.createElement("p"); e.className = "empty";
      e.textContent = "Order details unavailable."; root.appendChild(e); return;
    }
    if (data.success === false) {
      if (window.mcpHost && window.mcpHost.markRendered) window.mcpHost.markRendered();
      var failure = document.createElement("div"); failure.className = "notice error";
      failure.setAttribute("role", "alert");
      failure.textContent = data.error || data.message || "Order details are unavailable. Try again or open the request in ServiceNow.";
      root.appendChild(failure);
      return;
    }
    lastData = data;
    if (window.mcpHost && window.mcpHost.markRendered) window.mcpHost.markRendered();
    var order = data.order || data;
    var items = Array.isArray(data.items) ? data.items : (Array.isArray(order.requestItems) ? order.requestItems : []);
    var approvals = Array.isArray(data.approvals) ? data.approvals : [];

    var number = readStr(order.number) || readStr(order.sys_id).slice(0, 8);
    var orderSysId = readStr(order.sys_id);
    currentOrderSysId = orderSysId;
    var sd = readStr(order.short_description);
    var desc = readStr(order.description);
    var created = readStr(order.created_on) || readStr(order.sys_created_on);
    var updated = readStr(order.updated_on) || readStr(order.sys_updated_on);

    if (pendingBanner) {
      var pb = document.createElement("div"); pb.className = "notice success";
      pb.setAttribute("role", "status");
      pb.textContent = "\u2713 " + pendingBanner; root.appendChild(pb);
      pendingBanner = null;
    }
    if (pendingError) {
      var pe = document.createElement("div"); pe.className = "notice error";
      pe.setAttribute("role", "alert");
      pe.textContent = pendingError; root.appendChild(pe);
      pendingError = null;
    }

    var head = document.createElement("div"); head.className = "order-head";
    var eyebrow = document.createElement("div"); eyebrow.className = "eyebrow"; eyebrow.textContent = "ServiceNow request"; head.appendChild(eyebrow);
    var h1 = document.createElement("h1"); h1.textContent = number; head.appendChild(h1);
    var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = sd || "Catalog request"; head.appendChild(meta);
    root.appendChild(head);

    var phase = derivePhase(order, items, approvals, !!data.submitted);
    var statusPanel = document.createElement("section"); statusPanel.className = "status-panel " + phase.tone;
    var statusIcon = document.createElement("div"); statusIcon.className = "status-icon"; statusIcon.setAttribute("aria-hidden", "true"); statusIcon.textContent = phase.icon; statusPanel.appendChild(statusIcon);
    var statusBody = document.createElement("div");
    var titleRow = document.createElement("div"); titleRow.className = "status-title-row";
    var statusTitle = document.createElement("div"); statusTitle.className = "status-title"; statusTitle.textContent = phase.title; titleRow.appendChild(statusTitle);
    var statusChip = document.createElement("span"); statusChip.className = "chip"; statusChip.textContent = phase.badge; titleRow.appendChild(statusChip);
    statusBody.appendChild(titleRow);
    var statusCopy = document.createElement("div"); statusCopy.className = "status-copy"; statusCopy.textContent = phase.copy; statusBody.appendChild(statusCopy);
    var nextStep = document.createElement("div"); nextStep.className = "next-step";
    var nextStrong = document.createElement("strong"); nextStrong.textContent = "Next: "; nextStep.appendChild(nextStrong);
    nextStep.appendChild(document.createTextNode(phase.next)); statusBody.appendChild(nextStep);
    statusPanel.appendChild(statusBody); root.appendChild(statusPanel);

    var phaseIndex = { pending: 0, approved: 1, underway: 2, complete: 3 }[phase.key];
    if (phaseIndex != null) {
      var progress = document.createElement("div"); progress.className = "progress"; progress.setAttribute("aria-label", "Request progress"); progress.setAttribute("role", "list");
      ["Approval", "Queued", "Underway", "Complete"].forEach(function (label, index) {
        var step = document.createElement("div"); step.className = "progress-step " + (index < phaseIndex ? "done" : (index === phaseIndex ? "current" : ""));
        step.setAttribute("role", "listitem");
        if (index === phaseIndex) step.setAttribute("aria-current", "step");
        var dot = document.createElement("div"); dot.className = "progress-dot"; dot.setAttribute("aria-hidden", "true"); dot.textContent = index < phaseIndex ? "\u2713" : ""; step.appendChild(dot);
        var stepLabel = document.createElement("div"); stepLabel.textContent = label; step.appendChild(stepLabel); progress.appendChild(step);
      });
      root.appendChild(progress);
    }

    var facts = document.createElement("div"); facts.className = "facts";
    function fact(label, value) {
      if (!value) return;
      var wrapper = document.createElement("div"); wrapper.className = "fact";
      var factLabel = document.createElement("div"); factLabel.className = "fact-label"; factLabel.textContent = label; wrapper.appendChild(factLabel);
      var factValue = document.createElement("div"); factValue.className = "fact-value"; factValue.textContent = value; wrapper.appendChild(factValue);
      facts.appendChild(wrapper);
    }
    fact("Requested for", readStr(order.requested_for));
    fact("Submitted", created);
    fact("Last updated", updated);
    if (phase.key === "underway") fact("Assigned to", readStr(order.assigned_to) || readStr(order.assignment_group));
    if (facts.childNodes.length) root.appendChild(facts);

    if (items.length > 0) {
      var h2 = document.createElement("h2"); h2.textContent = items.length === 1 ? "Requested item" : "Requested items"; root.appendChild(h2);
      var list = document.createElement("div"); list.className = "items";
      items.slice(0, 3).forEach(function (it) {
        var card = document.createElement("div"); card.className = "item";
        var itemRow = document.createElement("div"); itemRow.className = "item-row";
        var itemText = document.createElement("div");
        var name = document.createElement("div"); name.className = "name";
        var catName = (it.catalogItem && (it.catalogItem.name || it.catalogItem.short_description)) || "";
        name.textContent = catName || readStr(it.short_description) || readStr(it.number);
        itemText.appendChild(name);
        var d = readStr(it.short_description) || readStr(it.description);
        if (d && d !== name.textContent) {
          var dd = document.createElement("div"); dd.className = "desc"; dd.textContent = d; itemText.appendChild(dd);
        }
        itemRow.appendChild(itemText);
        var badges = document.createElement("div"); badges.className = "item-badges";
        var qtyText = parseInt(readStr(it.quantity), 10);
        if (qtyText > 1) { var qtyChip = document.createElement("span"); qtyChip.className = "chip"; qtyChip.textContent = "Qty " + qtyText; badges.appendChild(qtyChip); }
        var itemStage = readStr(it.stage) || readStr(it.state);
        if (itemStage) { var stageChip = document.createElement("span"); stageChip.className = "chip"; stageChip.textContent = itemStage; badges.appendChild(stageChip); }
        if (badges.childNodes.length) itemRow.appendChild(badges);
        card.appendChild(itemRow);
        list.appendChild(card);
      });
      if (items.length > 3) {
        var more = document.createElement("div"); more.className = "item more"; more.textContent = "+ " + (items.length - 3) + " more items"; list.appendChild(more);
      }
      root.appendChild(list);
    }

    var firstPendingApproval = null;
    var pendingCount = 0;
    approvals.forEach(function (approval) {
      if (approval.can_decide === true && readStr(approval.sys_id) && isPendingApprovalState(readStr(approval.state))) {
        pendingCount += 1;
        if (!firstPendingApproval) firstPendingApproval = approval;
      }
    });
    if (approvals.length > 0) {
      var ah = document.createElement("h2"); ah.textContent = phase.key === "pending" ? "Approval required" : "Approval history"; root.appendChild(ah);
      var alist = document.createElement("div"); alist.className = "approvals";
      var visibleApprovals = firstPendingApproval ? [firstPendingApproval] : [];
      approvals.forEach(function (approval) {
        if (visibleApprovals.length >= 3 || approval === firstPendingApproval) return;
        visibleApprovals.push(approval);
      });
      visibleApprovals.forEach(function (ap) {
        var stateText = readStr(ap.state) || "Pending";
        var approval = document.createElement("div"); approval.className = "approval";
        var approvalRow = document.createElement("div"); approvalRow.className = "approval-row";
        var approverWrap = document.createElement("div");
        var approver = document.createElement("div"); approver.className = "name"; approver.textContent = readStr(ap.approver) || "Assigned approver"; approverWrap.appendChild(approver);
        var approvalMeta = document.createElement("div"); approvalMeta.className = "approval-meta"; approvalMeta.textContent = stateText; approverWrap.appendChild(approvalMeta);
        var dot = document.createElement("span"); dot.className = "state-dot " + (classifyApprovalState(stateText) === "approved" ? "approved" : (classifyApprovalState(stateText) === "rejected" ? "rejected" : "")); dot.setAttribute("aria-hidden", "true");
        approvalRow.appendChild(approverWrap); approvalRow.appendChild(dot); approval.appendChild(approvalRow); alist.appendChild(approval);
      });
      root.appendChild(alist);
    }

    if (firstPendingApproval) {
      var decision = document.createElement("div"); decision.className = "decision";
      var decisionTitle = document.createElement("div"); decisionTitle.className = "decision-title"; decisionTitle.textContent = "Decision for " + (readStr(firstPendingApproval.approver) || "assigned approver"); decision.appendChild(decisionTitle);
      var decisionCopy = document.createElement("div"); decisionCopy.className = "decision-copy"; decisionCopy.textContent = pendingCount > 1 ? (pendingCount + " approvals assigned to you are waiting.") : "Your decision will be recorded in ServiceNow. A reason is required to reject."; decision.appendChild(decisionCopy);
      var noteLabel = document.createElement("label"); noteLabel.className = "decision-copy"; noteLabel.setAttribute("for", "approval-note"); noteLabel.textContent = "Approval note or rejection reason"; decision.appendChild(noteLabel);
      var noteError = document.createElement("div"); noteError.className = "decision-copy"; noteError.id = "approval-note-error"; noteError.setAttribute("role", "alert"); noteError.hidden = true; decision.appendChild(noteError);
      var note = document.createElement("input"); note.id = "approval-note"; note.type = "text"; note.placeholder = "Optional for approval"; note.setAttribute("aria-describedby", "approval-note-error"); decision.appendChild(note); root.appendChild(decision);

      var decisionActions = document.createElement("div"); decisionActions.className = "actions";
      var approveBtn = document.createElement("button"); approveBtn.className = "primary"; approveBtn.textContent = "Approve";
      approveBtn.addEventListener("click", function () {
        setBusy(root, true);
        applyOrderResult(tryCall("approve_order_approval", { orderSysId: orderSysId, approvalSysId: readStr(firstPendingApproval.sys_id), comment: note.value.trim() || undefined }), "Approval recorded.", function () {
          sendFollowUp("Approve pending approval " + readStr(firstPendingApproval.sys_id) + " for order " + number + (note.value.trim() ? (". Comment: " + note.value.trim()) : "."));
        });
      });
      var rejectBtn = document.createElement("button"); rejectBtn.className = "danger"; rejectBtn.textContent = "Reject";
      rejectBtn.addEventListener("click", function () {
        var reason = note.value.trim();
        if (!reason) { note.focus(); note.setAttribute("aria-invalid", "true"); noteError.hidden = false; noteError.textContent = "Enter a reason before rejecting."; return; }
        setBusy(root, true);
        applyOrderResult(tryCall("reject_order_approval", { orderSysId: orderSysId, approvalSysId: readStr(firstPendingApproval.sys_id), reason: reason }), "Rejection recorded.", function () {
          sendFollowUp("Reject pending approval " + readStr(firstPendingApproval.sys_id) + " for order " + number + ". Reason: " + reason);
        });
      });
      decisionActions.appendChild(approveBtn); decisionActions.appendChild(rejectBtn); root.appendChild(decisionActions);
      return;
    }

    if (interactionMode === "cancel") {
      var confirm = document.createElement("div"); confirm.className = "confirm";
      var confirmTitle = document.createElement("strong"); confirmTitle.textContent = "Request cancellation?"; confirm.appendChild(confirmTitle);
      var confirmCopy = document.createElement("p"); confirmCopy.textContent = "This asks the fulfillment team to cancel the request; it does not change the state immediately."; confirm.appendChild(confirmCopy); root.appendChild(confirm);
      var confirmActions = document.createElement("div"); confirmActions.className = "actions";
      var sendCancel = document.createElement("button"); sendCancel.className = "danger"; sendCancel.textContent = "Send request";
      sendCancel.addEventListener("click", function () {
        setBusy(root, true);
        applyOrderResult(tryCall("update_order", { orderSysId: orderSysId, updates: { comments: "Cancellation requested by the requestor via Microsoft 365 Copilot." } }), "Cancellation requested.", function () {
          sendFollowUp("Please request cancellation of order " + number + " (sys_id " + orderSysId + ").");
        });
      });
      var back = document.createElement("button"); back.textContent = "Back"; back.addEventListener("click", function () { interactionMode = null; render(lastData); });
      confirmActions.appendChild(sendCancel); confirmActions.appendChild(back); root.appendChild(confirmActions);
      return;
    }

    var actions = document.createElement("div"); actions.className = "actions";
    var snLink = readStr(data.link);
    if (snLink) {
      var view = document.createElement("a"); view.className = "btn-link primary"; view.textContent = "View in ServiceNow";
      view.href = snLink; view.target = "_blank"; view.rel = "noopener noreferrer";
      view.addEventListener("click", function (event) { event.preventDefault(); openExternal(snLink); }); actions.appendChild(view);
    }
    if (["approved", "underway", "submitted"].indexOf(phase.key) >= 0 && orderSysId) {
      var cancelBtn = document.createElement("button"); cancelBtn.textContent = "Request cancellation";
      cancelBtn.addEventListener("click", function () { interactionMode = "cancel"; render(lastData); }); actions.appendChild(cancelBtn);
    }
    if (actions.childNodes.length) root.appendChild(actions);
  }

  // --- In-widget action plumbing -------------------------------------------
  // Disable/enable all controls inside a card or the root while a tool runs.
  function setBusy(el, busy) {
    var container = el || root;
    var nodes = container.querySelectorAll("button, input, textarea");
    for (var i = 0; i < nodes.length; i++) { nodes[i].disabled = !!busy; }
    container.setAttribute("aria-busy", busy ? "true" : "false");
    var status = container.querySelector(".busy-status");
    if (busy && !status) {
      status = document.createElement("div");
      status.className = "busy-status";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.textContent = "Working...";
      container.appendChild(status);
    } else if (!busy && status) {
      status.remove();
    }
  }
  function tryCall(name, args) {
    try { return callTool(name, args); }
    catch (_) { return null; }
  }
  function reRender() { if (lastData) render(lastData); }
  // Pull fresh order detail and re-render in place. Used after tools that don't
  // themselves return the order-detail shape (e.g. update_order).
  function refreshDetail(sysId) {
    var p = tryCall("get_order_detail", { orderSysId: sysId });
    if (!p || typeof p.then !== "function") { reRender(); return; }
    p.then(function (r) {
      var dat = unwrapResult(r);
      if (dat && dat.order) { render(dat); } else { reRender(); }
    }).catch(function () { reRender(); });
  }
  // Resolve a tool promise: render the returned order detail when present,
  // otherwise refresh from the server (success without a body) or fall back to
  // a chat follow-up (host gated tools/call or hard failure).
  function applyOrderResult(p, okMsg, fallbackFn) {
    if (!p || typeof p.then !== "function") { if (fallbackFn) fallbackFn(); return; }
    p.then(function (result) {
      var detail = unwrapResult(result);
      interactionMode = null;
      if (detail && detail.order) { pendingBanner = okMsg || null; render(detail); return; }
      if (detail && detail.success === true) {
        pendingBanner = okMsg || null;
        if (detail.approvalRecorded && lastData && Array.isArray(lastData.approvals)) {
          lastData.approvals.forEach(function (approval) {
            if (readStr(approval.sys_id) === readStr(detail.approvalSysId)) {
              approval.state = detail.decision;
              approval.can_decide = false;
            }
          });
          render(lastData);
          return;
        }
        refreshDetail(currentOrderSysId);
        return;
      }
      if (detail && detail.success === false) { pendingError = detail.error || detail.message || "The request could not be updated."; reRender(); return; }
      if (fallbackFn) { pendingError = "This update will continue in Copilot."; fallbackFn(); reRender(); return; }
      reRender();
    }).catch(function () {
      interactionMode = null;
      if (fallbackFn) { pendingError = "This update will continue in Copilot."; fallbackFn(); }
      else { pendingError = "The request could not be updated. Try again or open it in ServiceNow."; }
      reRender();
    });
  }

  showLoading(root, "Loading order\u2026");
  if (!subscribe(render)) { render(getData()); }
})();
</script>
</body>
</html>
